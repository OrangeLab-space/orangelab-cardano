apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
    name: cardano-db-sync
    namespace: cardano
    labels:
        app.kubernetes.io/name: cardano
        app.kubernetes.io/part-of: orangelab-cardano
spec:
    namespaceSelector:
        matchNames:
            - cardano
    selector:
        matchLabels:
            app.kubernetes.io/name: cardano
            app.kubernetes.io/component: default
    podMetricsEndpoints:
        - portNumber: 8080
          path: /
          interval: 30s
          scrapeTimeout: 10s
          relabelings:
              - targetLabel: container
                replacement: db-sync
