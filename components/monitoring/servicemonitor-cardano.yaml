apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
    name: cardano
    namespace: cardano
    labels:
        app.kubernetes.io/name: cardano
        app.kubernetes.io/part-of: orangelab-cardano
spec:
    namespaceSelector:
        matchNames:
            - cardano
    selector:
        matchLabels:
            app.kubernetes.io/name: cardano
    endpoints:
        - port: metrics
          path: /metrics
          interval: 30s
          scrapeTimeout: 10s
        - port: sync-metrics
          path: /metrics
          interval: 30s
          scrapeTimeout: 10s
